[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlmmuq"
version = "0.1.0"
description = "Weak lensing mass mapping with uncertainty quantification"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
  { name = "Hubert Leterme", email = "hubert.leterme@ensicaen.fr" },
  { name = "Andreas Tersenov", email = "atersenov@physics.uoc.gr" }
]
dependencies = [
  "pyyaml",
  "tqdm",
  "numpy",
  "scipy",
  "scikit-image",
  "h5py",
  "matplotlib",
  "astropy",
  "lenspack",
  "deepinv==0.2.2",
  "torch",
  "torchinfo",
  "timm",
  "wandb",
]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/hubert-leterme/weaklensing_uq"